name: Deploy Quick-Obs to GitHub Pages

# Koerer ved push til main/master samt manuelt via "Run workflow".
# Ingen hemmelige noegler anvendes - kun det indbyggede GITHUB_TOKEN,
# som Actions-runneren automatisk stiller til raadighed.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Mindste noedvendige rettigheder til at laese repoet og deploye til Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Tillad kun én samtidig deployment; afbryd ikke en igangvaerende
# deployment, men lad den blive faerdig foerst.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Opsaet Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer dependencies
        run: npm ci

      - name: TypeScript-kontrol og production build
        run: npm run build

      - name: Opsaet GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build-output (dist/) som Pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
